<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fire Sprinkler Project Estimator & Plan Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=instrument-serif@400&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f4ef;--surface:#fbfaf7;--surface2:#f1ede7;--text:#231f1a;--muted:#6e6860;--border:#d7d1c8;--primary:#0a6670;--primary2:#b53b2f;--success:#247a43;--warn:#b57915;
      --shadow:0 10px 30px rgba(20,20,20,.08);--radius:22px;
    }
    [data-theme="dark"]{--bg:#12110f;--surface:#1a1816;--surface2:#201e1c;--text:#e8e4dd;--muted:#a29b92;--border:#2c2825;--primary:#54a8b1;--primary2:#e06a5b;--shadow:0 10px 30px rgba(0,0,0,.35)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:'Satoshi',system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .serif{font-family:'Instrument Serif',serif}
    .card{background:var(--surface);border:1px solid color-mix(in oklab,var(--text) 12%, transparent);border-radius:var(--radius);box-shadow:var(--shadow)}
    .soft{background:var(--surface2)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:16px;padding:.9rem 1.1rem;font-weight:700;border:1px solid transparent;transition:.2s ease;min-height:44px}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--primary);color:white}.btn-ghost{background:transparent;border-color:var(--border);color:var(--text)}.btn-danger{background:var(--primary2);color:white}
    .input,.select,.textarea{width:100%;padding:.9rem 1rem;border-radius:16px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font:inherit;outline:none}
    .input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklab,var(--primary) 18%, transparent)}
    .pill{padding:.35rem .7rem;border-radius:999px;font-size:.75rem;font-weight:700}
    .fade-in{animation:fade .35s ease} @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .hidden{display:none !important}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{width:min(1280px,100%);max-height:92vh;overflow:auto}
    .grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:24px}
    @media (max-width: 1024px){.grid2{grid-template-columns:1fr}}
    .metric{background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:16px}
    .metric .value{font-size:1.4rem;font-weight:800}.metric .formula{font-size:.78rem;color:var(--muted);font-family:ui-monospace,monospace}
    .section-title{font-size:clamp(2rem,2vw,3rem);line-height:1.05;margin:0}
    .empty{padding:44px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:22px;background:color-mix(in oklab,var(--surface) 80%, var(--bg))}
    .step{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}
    .dot{width:12px;height:12px;border-radius:999px;background:var(--primary);margin-top:5px;flex:0 0 auto}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width: 720px){.field-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <a href="#main" class="sr-only">Skip to content</a>
  <div id="app"></div>

  <template id="appTemplate">
    <header class="sticky top-0 z-30" style="background:color-mix(in oklab,var(--bg) 82%, transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)">
      <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
        <div>
          <div class="serif text-3xl">Fire Sprinkler Project Estimator & Plan Analyzer</div>
          <div style="color:var(--muted)">Estimate faster. Read plans smarter. Bid with confidence.</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="themeToggle" class="btn btn-ghost" aria-label="Toggle theme">Theme</button>
          <button id="openEstimate" class="btn btn-primary">Quick Estimate</button>
          <button id="openAnalyzer" class="btn btn-ghost">Plan Analyzer</button>
        </div>
      </div>
    </header>

    <main id="main" class="max-w-7xl mx-auto px-4 py-8 space-y-8">
      <section class="card p-6 md:p-8 fade-in">
        <div class="grid gap-6 md:grid-cols-5 text-center">
          <div><div class="text-3xl font-extrabold" id="statProjects">0</div><div style="color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em">Projects</div></div>
          <div><div class="text-3xl font-extrabold" id="statHeads">0</div><div style="color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em">Heads</div></div>
          <div><div class="text-3xl font-extrabold" id="statMinutes">0</div><div style="color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em">Minutes</div></div>
          <div><div class="text-3xl font-extrabold" id="statLast">—</div><div style="color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em">Last Project</div></div>
          <div><div class="text-3xl font-extrabold" id="statDallas">✓</div><div style="color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em">Dallas Logic</div></div>
        </div>
      </section>

      <section class="grid gap-6 md:grid-cols-2">
        <button id="openEstimate2" class="card p-8 text-left hover:scale-[1.01] transition">
          <div class="serif text-4xl mb-3">Quick Estimate</div>
          <p style="color:var(--muted)">Manual project entry with editable assumptions and a math-first live breakdown.</p>
        </button>
        <button id="openAnalyzer2" class="card p-8 text-left hover:scale-[1.01] transition">
          <div class="serif text-4xl mb-3">Plan Analyzer</div>
          <p style="color:var(--muted)">Upload plans or use demo mode for staged reading, counting, and confidence labels.</p>
        </button>
      </section>

      <section class="card p-6 md:p-8">
        <div class="flex items-center justify-between gap-4 mb-5">
          <h2 class="text-2xl font-bold m-0">Recent Projects</h2>
          <span class="pill" style="background:color-mix(in oklab,var(--primary) 12%, var(--surface2));color:var(--primary)">Fresh start</span>
        </div>
        <div id="projectsArea"></div>
      </section>
    </main>
  </template>

  <template id="estimateTemplate">
    <div class="overlay" id="estimateOverlay">
      <div class="card modal">
        <div class="px-6 py-5 flex items-center justify-between border-b" style="border-color:var(--border)">
          <div>
            <div class="serif text-4xl">Quick Estimate Calculator</div>
            <div style="color:var(--muted)">All numbers are editable through overrides, then recalculated with Update Estimate.</div>
          </div>
          <button class="btn btn-ghost" id="closeEstimate">Close</button>
        </div>
        <div class="p-6 grid2">
          <section class="space-y-4">
            <div class="field-row">
              <div><label>Project Name</label><input class="input" id="projectName" placeholder="Project name"></div>
              <div><label>Project Address</label><input class="input" id="projectAddress" placeholder="Dallas, TX or full address"></div>
            </div>
            <div class="field-row">
              <div><label>Project Type</label><select class="select" id="projectType"><option>New Construction / Ground Up</option><option>Existing Construction</option><option>Renovation</option></select></div>
              <div><label>Building Type</label><select class="select" id="buildingType"><option>Retail</option><option>Office</option><option>Warehouse</option><option>School</option><option>Medical</option><option>Mixed Use</option><option>Multifamily</option><option>Other</option></select></div>
            </div>
            <div class="field-row">
              <div><label>System Type</label><select class="select" id="systemType"><option>Wet</option><option>Dry</option></select></div>
              <div><label>Number of Floors</label><input class="input" id="numFloors" type="number" min="1" value="1"></div>
            </div>
            <div id="floorsWrap" class="space-y-3"></div>
            <div class="field-row">
              <div><label>Total Square Feet</label><input class="input" id="totalSqFt" type="number" value="0"></div>
              <div><label>Sprinkler Heads</label><input class="input" id="sprinklerHeads" type="number" step="0.01" value="0"></div>
            </div>
            <div class="field-row">
              <label><input type="checkbox" id="backflow"> Backflow</label>
              <label><input type="checkbox" id="firePump"> Fire Pump</label>
              <label><input type="checkbox" id="dryAddon"> Dry Add-on</label>
              <label><input type="checkbox" id="taxExempt"> Tax Exempt</label>
            </div>
            <div><label>Notes / Assumptions</label><textarea class="textarea" id="notes" rows="4" placeholder="Add assumptions..."></textarea></div>
          </section>
          <aside class="space-y-4">
            <div class="card soft p-5">
              <div class="flex items-center justify-between mb-4"><h3 class="text-xl font-bold m-0">Editable Overrides</h3><span class="pill" style="background:color-mix(in oklab,var(--primary2) 12%, var(--surface2));color:var(--primary2)">Manual control</span></div>
              <div class="field-row">
                <div><label>SH Override</label><input class="input" id="overrideSh" type="number" step="0.01" placeholder="Auto"></div>
                <div><label>Material Override</label><input class="input" id="overrideMaterial" type="number" step="0.01" placeholder="Auto"></div>
                <div><label>Labor Override</label><input class="input" id="overrideLabor" type="number" step="0.01" placeholder="Auto"></div>
                <div><label>Design Override</label><input class="input" id="overrideDesign" type="number" step="0.01" placeholder="Auto"></div>
                <div><label>Misc Override</label><input class="input" id="overrideMisc" type="number" step="0.01" placeholder="Auto"></div>
                <div><label>Profit %</label><input class="input" id="overrideProfitPct" type="number" step="0.01" value="20"></div>
                <div><label>Tax Rate %</label><input class="input" id="overrideTaxRate" type="number" step="0.01" value="8.25"></div>
                <div><label>Rounding Method</label><select class="select" id="roundingMethod"><option value="round">Round</option><option value="ceil">Ceil</option></select></div>
              </div>
            </div>
            <div class="card soft p-5">
              <h3 class="text-xl font-bold m-0 mb-4">Live Breakdown</h3>
              <div class="space-y-3">
                <div class="metric"><div class="flex justify-between"><div>Material</div><div class="value" id="materialVal">$0</div></div><div class="formula" id="materialFormula">—</div></div>
                <div class="metric"><div class="flex justify-between"><div>Labor</div><div class="value" id="laborVal">$0</div></div><div class="formula" id="laborFormula">—</div></div>
                <div class="metric"><div class="flex justify-between"><div>Design</div><div class="value" id="designVal">$0</div></div><div class="formula" id="designFormula">—</div></div>
                <div class="metric"><div class="flex justify-between"><div>Misc</div><div class="value" id="miscVal">$0</div></div><div class="formula" id="miscFormula">—</div></div>
                <div class="metric"><div class="flex justify-between"><div>Subtotal #1</div><div class="value" id="subtotalVal">$0</div></div><div class="formula" id="subtotalFormula">—</div></div>
                <div class="metric"><div class="flex justify-between"><div>Taxes</div><div class="value" id="taxVal">$0</div></div><div class="formula" id="taxFormula">—</div></div>
                <div class="metric"><div class="flex justify-between"><div>Profit</div><div class="value" id="profitVal">$0</div></div><div class="formula" id="profitFormula">—</div></div>
                <div class="metric" style="border-color:color-mix(in oklab,var(--primary) 40%, var(--border));background:color-mix(in oklab,var(--primary) 8%, var(--surface2))"><div class="flex justify-between"><div>Final Total</div><div class="value" id="finalVal">$0</div></div><div class="formula" id="finalFormula">—</div></div>
              </div>
              <div class="mt-4 flex gap-3">
                <button class="btn btn-primary flex-1" id="updateEstimate">Update Estimate</button>
                <button class="btn btn-ghost flex-1" id="downloadPdf">Download PDF</button>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </template>

  <template id="analyzerTemplate">
    <div class="overlay" id="analyzerOverlay">
      <div class="card modal">
        <div class="px-6 py-5 flex items-center justify-between border-b" style="border-color:var(--border)">
          <div>
            <div class="serif text-4xl">AI Plan Analyzer</div>
            <div style="color:var(--muted)">Demo mode only: staged reading, counting, and confidence labels.</div>
          </div>
          <button class="btn btn-ghost" id="closeAnalyzer">Close</button>
        </div>
        <div class="p-6 grid2">
          <section class="space-y-4">
            <div class="card soft p-5 text-center">
              <input type="file" id="planFile" class="hidden" accept=".pdf,.png,.jpg,.jpeg" multiple>
              <label for="planFile" class="btn btn-primary">Upload Plans</label>
              <button id="runDemo" class="btn btn-ghost ml-2">Run Demo Analysis</button>
            </div>
            <div class="card soft p-5 hidden" id="analysisPanel">
              <div class="flex items-center justify-between mb-3"><h3 class="text-xl font-bold m-0">Analysis Progress</h3><span class="pill" id="analysisStatus">Idle</span></div>
              <div class="w-full h-2 rounded-full soft mb-4"><div id="analysisBar" style="width:0%;height:100%;background:var(--primary);border-radius:999px"></div></div>
              <div id="analysisSteps" class="space-y-2"></div>
              <div class="mt-4 card p-4 soft"><div class="text-sm" style="color:var(--muted)">Live log</div><div id="analysisLog" class="mt-2 text-sm" style="white-space:pre-wrap"></div></div>
            </div>
          </section>
          <aside class="space-y-4">
            <div class="card soft p-5">
              <h3 class="text-xl font-bold m-0 mb-3">Confidence Labels</h3>
              <div class="space-y-3 text-sm">
                <div><span class="pill" style="background:#d1fae5;color:#065f46">High</span> Explicitly found on title/legend/schedule.</div>
                <div><span class="pill" style="background:#fef3c7;color:#92400e">Medium</span> Inferred from notes or partial evidence.</div>
                <div><span class="pill" style="background:#fee2e2;color:#991b1b">Low</span> Estimated from limited evidence.</div>
                <div><span class="pill" style="background:#dbeafe;color:#1d4ed8">User Confirmed</span> Manually approved by estimator.</div>
              </div>
            </div>
            <div class="card soft p-5 hidden" id="analysisResult">
              <h3 class="text-xl font-bold m-0 mb-3">Project Findings</h3>
              <div id="findingList" class="space-y-3 text-sm"></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </template>

  <script>
    const app = document.getElementById('app');
    const startData = { projects: [] };
    let currentEstimate = null;
    let currentTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);

    function money(n){ return '$' + Math.round(Number(n||0)).toLocaleString(); }
    function num(n){ return Math.round(Number(n||0)).toLocaleString(); }
    function esc(s){ return String(s||'').replace(/[&<>\"]+/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m])); }

    function renderApp(){ app.innerHTML = document.getElementById('appTemplate').innerHTML; bindApp(); renderProjects(); animateStats(); }
    function renderProjects(){ document.getElementById('projectsArea').innerHTML = startData.projects.length ? startData.projects.map(p=>`<div class="step"><div class="dot"></div><div><div class="font-bold">${esc(p.name)}</div><div style="color:var(--muted)">${esc(p.address)} · ${esc(p.type)} · ${money(p.total)}</div></div></div>`).join('') : `<div class="empty"><div class="serif text-4xl mb-2">No projects yet</div><div>Start fresh with a new estimate or analyze your first plan set.</div></div>`; }
    function animateStats(){ const vals=[['statProjects',0],['statHeads',0],['statMinutes',0]]; vals.forEach(([id,v])=>document.getElementById(id).textContent=v); document.getElementById('statLast').textContent='—'; }

    function openEstimate(){ document.body.insertAdjacentHTML('beforeend', document.getElementById('estimateTemplate').innerHTML); const overlay=document.getElementById('estimateOverlay'); bindEstimate(); overlay.querySelector('#closeEstimate').onclick = ()=>overlay.remove(); overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); }); document.addEventListener('keydown', escCloseEstimate); initFloors(); recalc(); }
    function escCloseEstimate(e){ const overlay=document.getElementById('estimateOverlay'); if(e.key==='Escape' && overlay){ overlay.remove(); document.removeEventListener('keydown', escCloseEstimate); } }

    function bindEstimate(){
      const ids=['projectType','systemType','numFloors','totalSqFt','sprinklerHeads','backflow','firePump','dryAddon','taxExempt','overrideSh','overrideMaterial','overrideLabor','overrideDesign','overrideMisc','overrideProfitPct','overrideTaxRate','roundingMethod','projectAddress'];
      ids.forEach(id=>document.getElementById(id).addEventListener('input', ()=>{ if(id==='numFloors') initFloors(); if(id==='projectAddress') document.getElementById('projectAddress').value=document.getElementById('projectAddress').value; recalc(); }));
      document.getElementById('updateEstimate').onclick = recalc;
      document.getElementById('downloadPdf').onclick = pdfEstimate;
    }

    function initFloors(){
      const n = Math.max(1, parseInt(document.getElementById('numFloors').value||1));
      const wrap = document.getElementById('floorsWrap'); wrap.innerHTML='';
      for(let i=1;i<=n;i++){
        const row=document.createElement('div'); row.className='field-row'; row.innerHTML=`<div><label>Floor ${i} Sq Ft</label><input class="input floorSqFt" type="number" value="${i===1?20000:15000}"></div><div><label>Floor ${i} Notes</label><input class="input" placeholder="Optional"></div>`; wrap.appendChild(row);
      }
      wrap.querySelectorAll('.floorSqFt').forEach(i=>i.addEventListener('input', recalc));
    }

    function getLocation(){ const a=(document.getElementById('projectAddress').value||'').toLowerCase(); if(a.includes('dallas')) return 'Dallas'; if(a.includes('tx')) return 'Outside Dallas'; return 'Unknown'; }

    function recalc(){
      const type = document.getElementById('projectType').value;
      const system = document.getElementById('systemType').value;
      const floors = [...document.querySelectorAll('.floorSqFt')].map(i=>Number(i.value||0));
      const totalSqFtAuto = floors.reduce((a,b)=>a+b,0);
      const totalSqFt = Number(document.getElementById('totalSqFt').value||totalSqFtAuto);
      const shAuto = totalSqFt/95;
      const sh = document.getElementById('overrideSh').value !== '' ? Number(document.getElementById('overrideSh').value) : shAuto;
      document.getElementById('sprinklerHeads').value = sh.toFixed(2);
      const location = getLocation();
      let material = system==='Dry' ? sh*180 : sh*(location==='Dallas' ? 105 : 150);
      let labor = sh*32;
      let designRaw = sh*11;
      let design = Math.max(designRaw, 1000);
      let misc = 5000 + (document.getElementById('firePump').checked ? 10000 : 0) + (document.getElementById('dryAddon').checked ? 14000 : 0) + (document.getElementById('backflow').checked ? 5000 : 0);
      if(document.getElementById('overrideMaterial').value!=='') material = Number(document.getElementById('overrideMaterial').value);
      if(document.getElementById('overrideLabor').value!=='') labor = Number(document.getElementById('overrideLabor').value);
      if(document.getElementById('overrideDesign').value!=='') design = Number(document.getElementById('overrideDesign').value);
      if(document.getElementById('overrideMisc').value!=='') misc = Number(document.getElementById('overrideMisc').value);
      const subtotal = material + labor + design + misc;
      const taxRate = Number(document.getElementById('overrideTaxRate').value||8.25)/100;
      const profitPct = Number(document.getElementById('overrideProfitPct').value||20)/100;
      const taxes = document.getElementById('taxExempt').checked ? 0 : (material + misc) * taxRate;
      const profit = subtotal * profitPct;
      let final = subtotal + taxes + profit;
      if(type.includes('Existing')){ if(sh<=50) final = sh*300; else if(sh<=150) final = sh*150; else final = sh*100; }
      if(document.getElementById('roundingMethod').value==='ceil') final = Math.ceil(final);
      const set=(id,v)=>document.getElementById(id).textContent=v;
      set('materialVal', money(material)); set('laborVal', money(labor)); set('designVal', money(design)); set('miscVal', money(misc)); set('subtotalVal', money(subtotal)); set('taxVal', money(taxes)); set('profitVal', money(profit)); set('finalVal', money(final));
      set('materialFormula', `${num(sh)} SH × ${system==='Dry' ? '$180' : '$'+(location==='Dallas' ? '105' : '150')} (${location})`);
      set('laborFormula', `${num(sh)} SH × $32`);
      set('designFormula', `${num(sh)} SH × $11${design===1000?' · Min $1,000':''}`);
      set('miscFormula', `Base $5,000${document.getElementById('firePump').checked?' + Fire Pump $10,000':''}${document.getElementById('dryAddon').checked?' + Dry Add-on $14,000':''}${document.getElementById('backflow').checked?' + Backflow $5,000':''}`);
      set('subtotalFormula', 'Material + Labor + Design + Misc');
      set('taxFormula', document.getElementById('taxExempt').checked ? 'Tax Exempt = $0' : `(Material + Misc) × ${(taxRate*100).toFixed(2)}%`);
      set('profitFormula', `Subtotal × ${(profitPct*100).toFixed(2)}%`);
      set('finalFormula', type.includes('Existing') ? 'Existing Construction tier pricing' : 'Subtotal + Taxes + Profit');
      currentEstimate = {type, system, totalSqFt, sh, material, labor, design, misc, subtotal, taxes, profit, final, location};
    }

    function pdfEstimate(){
      if(!window.jspdf?.jsPDF) return alert('PDF library failed to load.');
      const { jsPDF } = window.jspdf; const d = new jsPDF();
      d.setFontSize(18); d.text('Fire Sprinkler Estimate Report', 20, 20);
      if(!currentEstimate) recalc();
      const c = currentEstimate;
      let y = 34;
      [['Project',document.getElementById('projectName').value],['Address',document.getElementById('projectAddress').value],['Type',c.type],['System',c.system],['Location',c.location],['Total Sq Ft',c.totalSqFt],['Heads',c.sh.toFixed(2)],['Material',money(c.material)],['Labor',money(c.labor)],['Design',money(c.design)],['Misc',money(c.misc)],['Subtotal',money(c.subtotal)],['Taxes',money(c.taxes)],['Profit',money(c.profit)],['Final Total',money(c.final)]].forEach(([k,v])=>{ d.text(`${k}: ${v}`,20,y); y+=8; }); d.save('sprinkler-estimate.pdf');
    }

    function openAnalyzer(){ document.body.insertAdjacentHTML('beforeend', document.getElementById('analyzerTemplate').innerHTML); const overlay=document.getElementById('analyzerOverlay'); bindAnalyzer(); overlay.querySelector('#closeAnalyzer').onclick = ()=>overlay.remove(); overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); }); document.addEventListener('keydown', escCloseAnalyzer); }
    function escCloseAnalyzer(e){ const overlay=document.getElementById('analyzerOverlay'); if(e.key==='Escape' && overlay){ overlay.remove(); document.removeEventListener('keydown', escCloseAnalyzer); } }

    function bindAnalyzer(){
      const panel=document.getElementById('analysisPanel');
      document.getElementById('runDemo').onclick = async ()=>{
        panel.classList.remove('hidden'); document.getElementById('analysisResult').classList.add('hidden'); const steps=['Upload received','Rendering sheets','Correcting orientation','Reading title block','OCR text extraction','Detecting sheet types','Searching for square footage','Looking for sprinkler head counts','Identifying wet/dry indicators','Scanning for backflow references','Scanning for fire pump references','Detecting dry system notes','Estimating floor count','Parsing occupancy/building type','Cross-checking address/location','Building confidence map','Generating structured report','Finalizing estimate'];
        const stepsWrap=document.getElementById('analysisSteps'); const log=document.getElementById('analysisLog'); stepsWrap.innerHTML=''; log.textContent='';
        for(let i=0;i<steps.length;i++){ stepsWrap.innerHTML = steps.map((s,idx)=>`<div class="step" style="opacity:${idx<=i?1:.35}"><div class="dot"></div><div><div class="font-bold">${s}</div><div style="color:var(--muted);font-size:.85rem">${idx<=i?'Complete':'Pending'}</div></div></div>`).join(''); document.getElementById('analysisBar').style.width = `${((i+1)/steps.length)*100}%`; document.getElementById('analysisStatus').textContent = steps[i]; log.textContent += `${steps[i]}...\n`; await new Promise(r=>setTimeout(r, 120)); }
        document.getElementById('analysisResult').classList.remove('hidden'); document.getElementById('findingList').innerHTML = `
          <div class="step"><div class="dot"></div><div><div class="font-bold">Building Type</div><div>Retail <span class="pill" style="background:#d1fae5;color:#065f46">High Confidence</span></div></div></div>
          <div class="step"><div class="dot"></div><div><div class="font-bold">Fire Pump</div><div>Present <span class="pill" style="background:#fef3c7;color:#92400e">Medium Confidence</span></div></div></div>
          <div class="step"><div class="dot"></div><div><div class="font-bold">Total Sq Ft</div><div>154,800 <span class="pill" style="background:#fee2e2;color:#991b1b">Low Confidence</span></div></div></div>
          <div class="step"><div class="dot"></div><div><div class="font-bold">Heads</div><div>1,629 <span class="pill" style="background:#dbeafe;color:#1d4ed8">User Confirmed</span></div></div></div>`;
      };
    }

    function bindApp(){
      document.getElementById('themeToggle').onclick = ()=>{ currentTheme = currentTheme==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme', currentTheme); };
      document.getElementById('openEstimate').onclick = openEstimate;
      document.getElementById('openEstimate2').onclick = openEstimate;
      document.getElementById('openAnalyzer').onclick = openAnalyzer;
      document.getElementById('openAnalyzer2').onclick = openAnalyzer;
    }

    renderApp();
  </script>
</body>
